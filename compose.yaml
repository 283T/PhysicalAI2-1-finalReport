services:
  dev:
    build:
      context: .
      target: dev
    image: pai-pcb-assembly:jazzy
    init: true
    working_dir: /workspace
    environment:
      FASTRTPS_DEFAULT_PROFILES_FILE: /workspace/configs/fastdds_rgbd.xml
    stdin_open: true
    tty: true
    volumes:
      - .:/workspace
    command: ["bash"]
  gui:
    profiles: ["gui"]
    build:
      context: .
      target: gui
    image: pai-pcb-assembly:gui
    init: true
    working_dir: /workspace
    environment:
      FASTRTPS_DEFAULT_PROFILES_FILE: /workspace/configs/fastdds_rgbd.xml
    shm_size: "512mb"
    ports:
      - "127.0.0.1:${GUI_PORT:-6080}:6080"
    volumes:
      - .:/workspace
    command: ["python3", "scripts/start_desktop.py"]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:6080/vnc.html', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 6
