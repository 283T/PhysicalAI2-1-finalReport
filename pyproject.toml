[tool.ruff]
# System Python on macOS is 3.9; ROS 2 Jazzy uses Python 3.12.
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# Tests deliberately add scripts/ to sys.path before importing project modules.
"tests/*.py" = ["E402"]
